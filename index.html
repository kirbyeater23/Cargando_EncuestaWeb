<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargando... · Encuesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --crema:#F6F0EA;      /* pictogramas: crema */
  --azul:#598CB4;       /* pictogramas: azul */
  --rojo:#E06C6F;       /* pictogramas: rojo/rosa */
  --negro:#000;
  --papel:#F2F2F0;      /* fondo del cartel */
  --sans:'Rethink Sans',system-ui,sans-serif;
  --mono:'Roboto Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{overflow-x:hidden;background:var(--papel);color:var(--negro);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.02em;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--negro);outline-offset:3px;border-radius:6px}

/* ---------- fondo granulado ---------- */
#fondo{position:fixed;inset:0;width:100%;height:100%;z-index:0;transition:opacity .35s ease}
#fondo.off{opacity:0}
.vineta{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(150,152,150,.22) 100%)}

/* ---------- estructura ---------- */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.cab{display:flex;justify-content:space-between;align-items:flex-start;padding:clamp(14px,2.4vh,26px) clamp(16px,2.6vw,32px) 0;font-size:clamp(11px,1.5vh,14px);line-height:1.45;gap:16px}
.cab .der{text-align:left;min-width:max-content}
.pantalla{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 clamp(16px,3.4vw,48px);overflow-y:auto;scrollbar-width:none;animation:entra .5s cubic-bezier(.2,.7,.2,1) both}
.pantalla::-webkit-scrollbar{display:none}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pie{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:clamp(10px,1.8vh,20px) clamp(16px,2.6vw,32px) clamp(14px,2.4vh,26px)}

/* ---------- botones ---------- */
.btn{font-family:var(--mono);text-transform:uppercase;letter-spacing:.03em;font-weight:700;font-size:clamp(13px,1.9vh,16px);min-height:52px;padding:0 28px;border:2px solid var(--negro);border-radius:999px;background:var(--crema);transition:transform .12s,background .15s}
.btn:hover:not(:disabled){background:var(--rojo);transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.primario{background:var(--azul);color:#fff}
.btn.primario:hover:not(:disabled){background:var(--rojo);color:#000}
.btn:disabled{opacity:.38;cursor:not-allowed;background:var(--crema);color:#000}
.btn.fantasma{border-color:transparent;background:transparent;min-height:44px;padding:0 10px;font-weight:500;text-decoration:underline;text-underline-offset:4px}
.btn.fantasma:hover:not(:disabled){background:transparent;transform:none;color:var(--rojo)}

/* ---------- progreso con pictogramas ---------- */
.prog{display:flex;align-items:center;gap:clamp(8px,1.6vw,18px)}
.prog .p{width:clamp(30px,4.6vh,44px);height:clamp(30px,4.6vh,44px);display:grid;place-items:center;opacity:.28;filter:grayscale(.6);transition:all .3s}
.prog .p img{max-width:100%;max-height:100%;display:block}
.prog .p.hecho{opacity:.85;filter:none}
.prog .p.actual{opacity:1;filter:none;transform:scale(1.28)}
.prog .p.tu{border:2px solid #000;border-radius:50%;font-family:var(--mono);font-size:11px;font-weight:700;background:var(--crema)}
.prog .p.tu.hecho,.prog .p.tu.actual{background:var(--azul);color:#fff}

/* ---------- bienvenida ---------- */
.bienvenida{align-items:center;justify-content:center;text-align:center;position:relative}
.pila{position:relative;width:min(560px,86vw);height:min(36vh,330px);margin:0 auto}
.pila img{position:absolute;filter:url(#disuelve)}
.titulo-cartel{font-family:var(--sans);font-weight:700;letter-spacing:-.035em;line-height:.95;font-size:clamp(52px,min(15vh,14.5vw),150px);color:#fff;text-shadow:0 0 30px rgba(0,0,0,.22);margin-top:calc(clamp(52px,min(15vh,14.5vw),150px) * -.62);position:relative;z-index:2;pointer-events:none}
.titulo-cartel .pts span{animation:punto 1.4s infinite both}
.titulo-cartel .pts span:nth-child(2){animation-delay:.2s}
.titulo-cartel .pts span:nth-child(3){animation-delay:.4s}
@keyframes punto{0%,15%{opacity:.15}40%,100%{opacity:1}}
.bienvenida .texto{max-width:560px;margin:clamp(14px,3vh,34px) auto 0;font-size:clamp(16px,2.3vh,20px);line-height:1.45;font-weight:500}
.bienvenida .texto p+p{margin-top:.7em}
.bienvenida .btn{margin-top:clamp(16px,3vh,30px)}

/* ---------- pantallas de texto ---------- */
.texto-central{max-width:680px;margin:auto;padding:12px 0}
.texto-central h2,.titular{font-family:var(--sans);font-weight:700;letter-spacing:-.03em;line-height:1;font-size:clamp(40px,8vh,84px)}
.texto-central p{font-size:clamp(17px,2.5vh,22px);line-height:1.5;margin-top:.9em;font-weight:500}
.caja{margin-top:1.4em;border:2px solid #000;border-radius:18px;background:var(--crema);padding:18px 20px}
.caja .mono{font-size:12px;display:block;margin-bottom:6px;color:#000}
.caja p{margin:0;font-size:clamp(16px,2.2vh,19px)}
.check{display:flex;gap:14px;align-items:center;margin-top:1.6em;cursor:pointer;font-size:clamp(16px,2.2vh,19px);font-weight:600;line-height:1.35}
.check input{appearance:none;flex:none;width:36px;height:36px;border:2px solid #000;border-radius:10px;background:var(--crema);display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--azul)}
.check input:checked::after{content:"";width:10px;height:18px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg) translate(-2px,-2px)}

/* ---------- sección con preguntas ---------- */
.seccion{display:grid;grid-template-columns:minmax(220px,32%) 1fr;gap:clamp(16px,3.4vw,56px);align-items:start;padding-top:clamp(8px,2vh,24px);padding-bottom:12px}
.lado{position:sticky;top:0;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,18px)}
.lado .num{font-size:clamp(12px,1.6vh,14px)}
.lado .titular{font-size:clamp(46px,10.5vh,104px)}
.lado .picto{width:min(100%,clamp(150px,30vh,300px));margin-top:clamp(0px,1vh,10px);filter:url(#disuelve2);transform:rotate(-4deg)}
.lado .nota{font-size:clamp(14px,1.9vh,17px);line-height:1.4;font-weight:500;max-width:30ch}
.preguntas{display:flex;flex-direction:column;gap:clamp(6px,1.4vh,18px)}
.intro-f{font-weight:600;font-size:clamp(15px,2vh,18px);display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.intro-f .mono{font-size:11.5px;font-weight:500}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;min-width:0;gap:8px 18px;align-items:center;padding-bottom:clamp(6px,1.2vh,14px);border-bottom:2px solid #000}
.q.ancha{grid-template-columns:1fr}
.q .t{font-size:clamp(15px,2.15vh,21px);font-weight:600;line-height:1.25;letter-spacing:-.01em}
.q .t .lbl{display:block;font-family:var(--mono);text-transform:uppercase;font-size:11px;font-weight:500;letter-spacing:.04em;margin-bottom:3px}
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.q.ancha .opciones{gap:8px}
.op{position:relative}
.op input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;margin:0}
.op span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:clamp(42px,5.7vh,52px);min-width:clamp(52px,6vw,86px);padding:0 12px;border:2px solid #000;border-radius:14px;background:var(--crema);font-family:var(--mono);text-transform:uppercase;font-weight:500;font-size:clamp(12px,1.75vh,14.5px);letter-spacing:.02em;transition:background .12s,transform .12s;line-height:1.15}
.opciones.rep{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opciones.rep .op span{width:100%;font-size:clamp(11px,1.6vh,13.5px)}
.op:hover span{background:#fff;transform:translateY(-2px)}
.op input:checked+span{background:var(--azul);color:#fff;font-weight:700;transform:none}
.op input:focus-visible+span{outline:3px solid #000;outline-offset:3px}
.freq .op span{min-width:clamp(58px,6.4vw,92px)}
.sin-cargo{border:2px dashed #000;border-radius:18px;padding:18px 20px;background:rgba(246,240,234,.85)}
.sin-cargo .mono{font-size:13px;line-height:1.5}
.otro-txt{margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.otro-txt input{font-family:var(--mono);text-transform:uppercase;font-size:14px;border:2px solid #000;border-radius:12px;padding:12px 14px;background:#fff;min-width:260px;flex:1}
.otro-txt small{font-family:var(--mono);text-transform:uppercase;font-size:11px}
.falta{font-size:12px;min-width:12ch}

/* ---------- final / ticket ---------- */
.final{display:grid;grid-template-columns:1fr minmax(280px,380px);gap:clamp(16px,4vw,64px);align-items:center;padding-top:clamp(8px,2vh,24px);padding-bottom:8px;min-height:100%}
.final .izq{display:flex;flex-direction:column;gap:18px}
.estado{font-size:clamp(13px,1.9vh,16px);line-height:1.5}
.barra{height:14px;border:2px solid #000;border-radius:99px;background:var(--crema);overflow:hidden;max-width:440px}
.barra i{display:block;height:100%;width:0;background:var(--rojo);border-right:2px solid #000;transition:width .25s linear}
.barra.ok i{border-right:0}
.final .grande{font-size:clamp(44px,9vh,92px)}
.final p.cuerpo{font-size:clamp(17px,2.4vh,22px);line-height:1.45;font-weight:500;max-width:30ch}
.ranura-wrap{position:relative;padding-top:18px}
.ranura{position:absolute;top:0;left:-3%;right:-3%;height:26px;background:#000;border-radius:14px;z-index:3;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.ranura::after{content:"";position:absolute;left:5%;right:5%;top:10px;height:5px;background:#3a3a3a;border-radius:4px}
.ticket-caja{overflow:visible;padding:0 4px 10px;min-height:0;container-type:inline-size}
.ticket{position:relative;background:#fff;color:#111;padding:8cqw 6cqw 10cqw;font-family:var(--mono);text-transform:uppercase;transform:translateY(-102%);transition:transform 2.6s cubic-bezier(.3,.6,.25,1)}
.ticket.sale{transform:none}
.ticket .th{text-align:left}
.ticket .th b{font-family:var(--sans);text-transform:none;font-weight:700;font-size:19.2cqw;letter-spacing:-.055em;line-height:.95;display:block;white-space:nowrap}
.ticket .th small{display:none}
.ticket .meta{font-size:3.4cqw;display:flex;justify-content:space-between;gap:8px;margin-top:16cqw}
.ticket hr{border:0;border-top:1px solid #111;margin:4cqw 0}
.ticket .cubo{display:flex;justify-content:space-between;align-items:center;font-size:3.4cqw;min-height:11cqw}
.ticket .cubo b{background:#111;color:#fff;padding:2.5cqw 3.5cqw;font-size:3.4cqw;letter-spacing:0;font-weight:500}
.ticket .filas{padding:3cqw 0}
.ticket .fila{display:flex;align-items:center;gap:10px;padding:2cqw 0;opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s}
.ticket .fila.v{opacity:1;transform:none}
.ticket .fila .n{flex:1;font-size:3.4cqw;font-weight:400}
.ticket .fila .c{font-size:5.7cqw;font-weight:700;line-height:1;min-width:2ch;text-align:right}
.ticket .total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.ticket .total span:first-child{font-size:5.5cqw;font-weight:400}
.ticket .total span:last-child{font-size:13cqw;line-height:1}
.ticket .pie-t{display:flex;gap:5cqw;align-items:stretch;margin-top:8cqw}
.ticket .sello{flex:1;border:1px dashed #111;min-height:23cqw;display:grid;place-items:center;font-size:3.4cqw;text-align:center;padding:6px;line-height:1.4}
.ticket .qr{width:23cqw;height:23cqw;flex:none;display:block}
.ticket .gracias{text-align:center;font-size:3.4cqw;margin-top:16cqw;letter-spacing:.02em}
.hecho-fila{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- diálogo ---------- */
.vel{position:fixed;inset:0;z-index:20;background:rgba(242,242,240,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.dlg{max-width:460px;background:var(--crema);border:2px solid #000;border-radius:22px;padding:26px}
.dlg h3{font-family:var(--sans);font-size:30px;letter-spacing:-.03em;line-height:1.05}
.dlg p{margin:10px 0 20px;font-size:17px;line-height:1.45;font-weight:500}
.dlg .acc{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- adaptación ---------- */
@media (max-width:820px){
  .opciones.rep{grid-template-columns:1fr 1fr}
  .seccion{grid-template-columns:minmax(0,1fr)}
  .pantalla{overflow-x:hidden}
  .pie{flex-wrap:wrap;justify-content:center}
  .pie .prog{order:3;width:100%;justify-content:center}
  .pie .btn{min-height:46px;padding:0 18px}
  .falta{display:none}
  .freq .op{flex:1}
  .freq .op span{min-width:0;padding:0 2px;font-size:12px}
  .opciones{min-width:0}
  .otro-txt input{min-width:0}
  .ticket-caja{max-height:none}
  .lado{position:static;flex-direction:row;align-items:center;flex-wrap:wrap}
  .lado .picto{width:90px;margin:0 0 0 auto}
  .lado .titular{font-size:48px}
  .lado .nota{display:none}
  .q{grid-template-columns:minmax(0,1fr)}
  .cab .der{display:none}
  .final{grid-template-columns:1fr}
  .ticket-caja{max-height:none}
  .titulo-cartel{margin-top:-40px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .ticket{transform:none}
}
</style>
</head>

</svg>
<canvas id="fondo" aria-hidden="true"></canvas>
<div class="vineta" aria-hidden="true"></div>
<div id="app"></div>

function pinta(nombre){
  fondoActual = nombre;
  const W = cv.width = Math.round(innerWidth), H = cv.height = Math.round(innerHeight);
  const ctx = cv.getContext('2d');
  const base = ctx.createLinearGradient(0,0,0,H);
  base.addColorStop(0,'#F4F4F2'); base.addColorStop(1,'#EDEEED');
  ctx.fillStyle = base; ctx.fillRect(0,0,W,H);
  const blobs = SPRAYS[nombre] || [];
  const m = Math.min(W,H);
  // velo suave bajo el grano
  blobs.forEach(b=>{
    const g = ctx.createRadialGradient(b.x*W,b.y*H,0,b.x*W,b.y*H,b.r*m*1.15);
    g.addColorStop(0,`rgba(${b.c},${.28*Math.min(b.s,1)})`); g.addColorStop(1,`rgba(${b.c},0)`);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  });
  // grano
  const img = ctx.createImageData(W,H), d = img.data;
  blobs.forEach((b,k)=>{
    const cx=b.x*W, cy=b.y*H, R=b.r*m*1.25, fase=k*1.7+1, f2=k*0.9;
    const x0=Math.max(0,Math.floor(cx-R*1.5)), x1=Math.min(W-1,Math.ceil(cx+R*1.5));
    const y0=Math.max(0,Math.floor(cy-R*1.5)), y1=Math.min(H-1,Math.ceil(cy+R*1.5));
    for(let y=y0;y<=y1;y++){
      for(let x=x0;x<=x1;x++){
        const dx=x-cx, dy=y-cy, ang=Math.atan2(dy,dx);
        const rr = R*(1+.22*Math.sin(ang*3+fase)+.12*Math.sin(ang*5+f2));
        const t = Math.sqrt(dx*dx+dy*dy)/rr;
        if(t>=1) continue;
        const p = b.s*Math.pow(1-t,1.35);
        if(Math.random()<p){
          const i=(y*W+x)*4, a=170+Math.random()*85;
          if(d[i+3]===0){ d[i]=b.c[0]; d[i+1]=b.c[1]; d[i+2]=b.c[2]; d[i+3]=a; }
          else if(Math.random()<.55){ d[i]=(d[i]+b.c[0])>>1; d[i+1]=(d[i+1]+b.c[1])>>1; d[i+2]=(d[i+2]+b.c[2])>>1; d[i+3]=Math.min(255,d[i+3]+30); }
        }
      }
    }
  });
  const off = document.createElement('canvas'); off.width=W; off.height=H;
  off.getContext('2d').putImageData(img,0,0);
  ctx.drawImage(off,0,0);
}
function cambiaFondo(nombre){
  cv.classList.add('off');
  setTimeout(()=>{ pinta(nombre); cv.classList.remove('off'); }, 260);
}
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>pinta(fondoActual),200); });

/* =====================================================================
   ESTADO Y LÓGICA
   ===================================================================== */
const PASOS = ['bienvenida','info','pensar','about','comida','cuidados','logistica','limpieza','finanzas','ticket'];
let paso = 0;
const S = nuevoEstado();
function nuevoEstado(){
  const o = {consent:false, resid:null, genero:null, ingreso:null, hogar:null, cat:{}};
  CATS.forEach(c=>{ o.cat[c.id] = {reparto:null, q:[null,null,null,null]}; });
  o.cat.cuidados.cargo = []; o.cat.cuidados.otro = '';
  return o;
}
function resetEstado(){ Object.keys(S).forEach(k=>delete S[k]); Object.assign(S, nuevoEstado()); }

const sinCargo = () => { const c=S.cat.cuidados.cargo; return c.length===1 && c[0]==='No'; };

function faltan(id){
  if(id==='about') return ['resid','genero','ingreso','hogar'].filter(k=>S[k]===null).length;
  const c = CATS.find(x=>x.id===id); if(!c) return 0;
  const e = S.cat[id];
  if(c.filtro){
    if(e.cargo.length===0) return 1;
    if(sinCargo()) return 0;
  }
  return (e.reparto===null?1:0) + e.q.filter(v=>v===null).length;
}
function puntos(id){
  if(id==='cuidados' && sinCargo()) return 0;
  return S.cat[id].q.reduce((a,v)=>a+(v||0),0);
}
function cubo(){
  if(S.genero==='Hombre') return 'HOMBRES';
  if(S.genero==='Mujer') return 'MUJERES';
  return 'SIN CUBO';
}
const codigo = () => Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');

/* Interpreta las respuestas y construye lo que se imprime */
function construyeTicket(){
  const filas = CATS.map(c=>({id:c.id, nombre:c.nombre, pic:c.pic, objetos:puntos(c.id)}));
  const total = filas.reduce((a,f)=>a+f.objetos,0);
  return {
    codigo: codigo(), punto: PUNTO, cubo: cubo(), filas, total,
    // Solo para la campaña. NO se imprime en el ticket:
    datos: {resideEnEspana:S.resid==='Sí', genero:S.genero, ingresosHogar:S.ingreso, personasHogar:S.hogar,
            reparto:Object.fromEntries(CATS.map(c=>[c.id,S.cat[c.id].reparto])), cargo:S.cat.cuidados.cargo}
  };
}
/* GANCHO DE IMPRESIÓN: aquí se enviaría el ticket al servicio de la impresora térmica
   y se guardarían los datos (solo al completar la encuesta). Ahora solo se simula. */
function enviarAImpresora(t){ console.log('[CARGANDO...] ticket →', t); }

/* =====================================================================
   UTILIDADES DE DOM
   ===================================================================== */
const $app = document.getElementById('app');
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class') el.className=v; else if(k==='html') el.innerHTML=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(v===true) el.setAttribute(k,''); else if(v!==false && v!=null) el.setAttribute(k,v);
  }
  kids.flat().forEach(k=>{ if(k!=null) el.append(k.nodeType?k:document.createTextNode(k)); });
  return el;
}
const pic = (k,cls)=>h('img',{src:IMG[k],alt:'',class:cls||'','aria-hidden':'true'});

function grupo(name, labels, valor, onSel, extra){
  const cont = h('div',{class:'opciones'+(extra?' '+extra:''),role:'radiogroup'});
  labels.forEach((lab,i)=>{
    const v = Array.isArray(lab)?lab[1]:lab, txt = Array.isArray(lab)?lab[0]:lab;
    const inp = h('input',{type:'radio',name,value:String(v)});
    if(valor===v) inp.checked = true;
    inp.addEventListener('change',()=>onSel(v));
    cont.append(h('label',{class:'op'},inp,h('span',{},txt)));
  });
  return cont;
}
function pregunta(titulo, nombre, labels, valor, onSel, opts={}){
  const t = h('div',{class:'t',id:'t-'+nombre}, opts.etq?h('span',{class:'lbl'},opts.etq):null, titulo);
  const g = grupo(nombre, labels, valor, onSel, (opts.freq?'freq':'')+(opts.rep?' rep':''));
  g.setAttribute('aria-labelledby','t-'+nombre);
  return h('div',{class:'q'+(opts.ancha?' ancha':'')}, t, g);
}

/* =====================================================================
   PANTALLAS
   ===================================================================== */
function cabecera(){
  return h('header',{class:'cab mono'},
    h('div',{},'8–14 DE FEBRERO'),
    h('div',{class:'der'},'PLAZA ESPAÑA',h('br'),'PLAZA DE LA REMONTA'));
}
function progreso(){
  const items = [['tu','about']].concat(CATS.map(c=>[c.pic,c.id]));
  const idx = PASOS.indexOf(PASOS[paso]);
  return h('nav',{class:'prog','aria-label':'Progreso'}, items.map(([k,id])=>{
    const pi = PASOS.indexOf(id);
    const cls = 'p'+(pi<paso?' hecho':'')+(pi===paso?' actual':'')+(k==='tu'?' tu':'');
    return k==='tu' ? h('div',{class:cls,title:'Sobre ti'},'TÚ') : h('div',{class:cls,title:CATS.find(c=>c.id===id).nombre},pic(k));
  }));
}
function pie({atras=true, siguiente, habil, onNext, dejar=true, falta}){
  const izq = h('div',{style:'display:flex;gap:6px;align-items:center'},
    atras? h('button',{class:'btn',onclick:()=>ir(paso-1),'aria-label':'Volver'},'← Atrás'):null,
    dejar? h('button',{class:'btn fantasma',onclick:dialogoDejar},'Dejar la encuesta'):null);
  const der = h('div',{style:'display:flex;gap:14px;align-items:center'},
    falta? h('span',{class:'mono falta','aria-live':'polite'},falta):null,
    h('button',{class:'btn primario',disabled:!habil,onclick:onNext},siguiente));
  return h('footer',{class:'pie'}, izq, progreso(), der);
}
function montar(nombreFondo, ...hijos){
  $app.replaceChildren(...hijos);
  cambiaFondo(nombreFondo);
}
function ir(n){ paso = Math.max(0,Math.min(PASOS.length-1,n)); pantalla(); }

function pantalla(){
  const id = PASOS[paso];
  if(id==='bienvenida') return pBienvenida();
  if(id==='info') return pInfo();
  if(id==='pensar') return pPensar();
  if(id==='about') return pAbout();
  if(id==='ticket') return pTicket();
  return pCategoria(CATS.find(c=>c.id===id));
}

function pBienvenida(){
  const pila = h('div',{class:'pila'},
    Object.assign(pic('hucha'),{style:'left:50%;top:0;width:34%;transform:rotate(8deg)'}),
    Object.assign(pic('calendario'),{style:'left:8%;top:6%;width:36%;transform:rotate(-6deg)'}),
    Object.assign(pic('panales'),{style:'left:2%;top:36%;width:34%;transform:rotate(-3deg)'}),
    Object.assign(pic('mocho'),{style:'right:6%;top:30%;width:34%;transform:rotate(4deg)'}),
    Object.assign(pic('tupper'),{style:'left:26%;top:62%;width:46%;transform:rotate(-2deg)'}));
  const el = h('main',{class:'pantalla bienvenida'},
    pila,
    h('h1',{class:'titulo-cartel','aria-label':'Cargando'},'Cargando',h('span',{class:'pts','aria-hidden':'true'},h('span',{},'.'),h('span',{},'.'),h('span',{},'.'))),
    h('div',{class:'texto'},
      h('p',{},'Vas a responder una encuesta anónima sobre cuánto piensas en las tareas del hogar. Son preguntas rápidas: solo tienes que tocar una opción.'),
      h('p',{},'Piensa en los últimos 7 días. No hay respuestas buenas ni malas, basta con una estimación.'),
      h('p',{},'Al terminar se imprimirá tu ticket. Con él pasarás por las salas.')),
    h('button',{class:'btn primario',onclick:()=>ir(1)},'Empezar'));
  montar('bienvenida', cabecera(), el);
}

function pInfo(){
  const chk = h('input',{type:'checkbox',id:'ok'}); chk.checked = S.consent;
  const next = pie({siguiente:'Continuar',habil:S.consent,onNext:()=>ir(2)});
  chk.addEventListener('change',()=>{ S.consent=chk.checked; next.querySelector('.primario').disabled=!S.consent; });
  const el = h('main',{class:'pantalla'}, h('div',{class:'texto-central'},
    h('h2',{},'Antes de empezar'),
    h('div',{class:'caja'},h('span',{class:'mono'},'Información'),
      h('p',{},'Esta encuesta forma parte de Cargando..., un proyecto académico de diseño gráfico. No te pedimos nombre, correo ni ningún dato que te identifique. Tus respuestas se usarán siempre junto a las de otras personas, para una campaña posterior. Si no resides en España, puedes participar y recibir tu ticket igualmente, pero tus respuestas no se incluirán en el análisis. Puedes dejar la encuesta cuando quieras.')),
    h('label',{class:'check',for:'ok'},chk,h('span',{},'He leído esta información y quiero participar.'))));
  montar('info', cabecera(), el, next);
}

function pPensar(){
  const el = h('main',{class:'pantalla'}, h('div',{class:'texto-central'},
    h('h2',{},'¿Qué es «pensar en algo»?'),
    h('p',{},'En esta encuesta, pensar en algo es tenerlo en la cabeza: planificarlo, recordarlo, decidirlo o comprobarlo. No importa si luego lo haces tú u otra persona; cuenta cuántas veces ha pasado por tu cabeza.'),
    h('div',{class:'caja'},h('span',{class:'mono'},'Ejemplo'),h('p',{},'Si el miércoles te acuerdas de que hay que comprar leche, eso cuenta como una vez.'))));
  montar('pensar', cabecera(), el, pie({siguiente:'Entendido',habil:true,onNext:()=>ir(3)}));
}

function pAbout(){
  const rerender = ()=>actualizaPie();
  const qs = h('div',{class:'preguntas'},
    pregunta('¿Resides actualmente en España?','resid',BLOQUE_A.resid,S.resid,v=>{S.resid=v;rerender();},{etq:'Sobre ti',ancha:false}),
    pregunta('¿Con qué género te identificas?','genero',BLOQUE_A.genero,S.genero,v=>{S.genero=v;rerender();}),
    pregunta('¿Cuál es, aproximadamente, el ingreso neto mensual total de tu hogar?','ingreso',BLOQUE_A.ingreso,S.ingreso,v=>{S.ingreso=v;rerender();},{ancha:true}),
    pregunta('¿Cuántas personas viven en tu hogar, contándote a ti?','hogar',BLOQUE_A.hogar,S.hogar,v=>{S.hogar=v;rerender();}));
  const lado = h('aside',{class:'lado'},
    h('div',{class:'mono num'},'Sobre ti'),
    h('h2',{class:'titular'},'Sobre ti'),
    h('p',{class:'nota'},'Estos datos no puntúan. Solo sirven para la campaña posterior.'));
  const el = h('main',{class:'pantalla'}, h('div',{class:'seccion'},lado,qs));
  let pieEl;
  function actualizaPie(){
    const f = faltan('about');
    const nuevo = pie({siguiente:'Siguiente',habil:f===0,onNext:()=>ir(4),falta:f?`Faltan ${f}`:''});
    pieEl.replaceWith(nuevo); pieEl = nuevo;
  }
  pieEl = pie({siguiente:'Siguiente',habil:false,onNext:()=>ir(4),falta:`Faltan ${faltan('about')}`});
  montar('about', cabecera(), el, pieEl);
}

function pCategoria(c){
  const e = S.cat[c.id];
  const n = CATS.indexOf(c)+1;
  const cuerpo = h('div',{class:'preguntas'});
  const lado = h('aside',{class:'lado'},
    h('div',{class:'mono num'},`Sala ${String(n).padStart(2,'0')} / 05`),
    h('h2',{class:'titular'},c.nombre),
    pic(c.pic,'picto'),
    h('p',{class:'nota'},c.nota));
  const el = h('main',{class:'pantalla'}, h('div',{class:'seccion'},lado,cuerpo));
  let pieEl;
  const siguienteTxt = n===5 ? 'Generar mi ticket' : 'Siguiente';
  const onNext = ()=> ir(paso+1);

  function actualizaPie(){
    const f = faltan(c.id);
    const nuevo = pie({siguiente:siguienteTxt,habil:f===0,onNext,falta:f?`Faltan ${f}`:''});
    pieEl.replaceWith(nuevo); pieEl = nuevo;
  }
  function dibuja(){
    cuerpo.replaceChildren();
    if(c.filtro){
      // filtro: ¿tienes a alguien a tu cargo? (casillas múltiples, "No" es excluyente)
      const g = h('div',{class:'opciones',role:'group','aria-labelledby':'t-cargo'});
      CARGO.forEach(op=>{
        const inp = h('input',{type:'checkbox',value:op}); inp.checked = e.cargo.includes(op);
        inp.addEventListener('change',()=>{
          if(op==='No'){ e.cargo = inp.checked?['No']:[]; }
          else { e.cargo = e.cargo.filter(x=>x!=='No'); if(inp.checked) e.cargo.push(op); else e.cargo=e.cargo.filter(x=>x!==op); }
          dibuja(); actualizaPie();
        });
        g.append(h('label',{class:'op'},inp,h('span',{},op)));
      });
      const bloque = h('div',{class:'q ancha'},
        h('div',{class:'t',id:'t-cargo'},h('span',{class:'lbl'},'Antes de empezar'),'¿Tienes a alguien a tu cargo?'), g);
      if(e.cargo.includes('Otra persona')){
        const t = h('input',{type:'text',maxlength:'30',placeholder:'¿QUIÉN? (OPCIONAL)','aria-label':'Especifica quién'}); t.value=e.otro;
        t.addEventListener('input',()=>{ e.otro=t.value; });
        bloque.append(h('div',{class:'otro-txt'},t,h('small',{},'No escribas nombres')));
      }
      cuerpo.append(bloque);
      if(sinCargo()){
        cuerpo.append(h('div',{class:'sin-cargo'},h('p',{class:'mono'},'Sin personas a tu cargo: te saltas esta categoría y recibes 0 objetos. Pasas por esta sala igualmente.')));
        return;
      }
      if(e.cargo.length===0) return;
    }
    cuerpo.append(pregunta(`En tu hogar, ¿quién se encarga normalmente de ${c.tema}?`,'rep-'+c.id,REPARTO,e.reparto,v=>{e.reparto=v;actualizaPie();},{etq:'Reparto · no puntúa',ancha:true,rep:true}));
    cuerpo.append(h('div',{class:'intro-f'},h('span',{},'En los últimos 7 días, ¿cuántas veces has pensado en…'),h('span',{class:'mono'},'Veces en 7 días')));
    c.qs.forEach((q,i)=>cuerpo.append(pregunta(q,`${c.id}-${i}`,FREC,e.q[i],v=>{e.q[i]=v;actualizaPie();},{freq:true})));
  }
  dibuja();
  const f0 = faltan(c.id);
  pieEl = pie({siguiente:siguienteTxt,habil:f0===0,onNext,falta:f0?`Faltan ${f0}`:''});
  montar(c.id, cabecera(), el, pieEl);
}

/* ---------- final: interpretar → generar → imprimir ---------- */
function qrDecorativo(){
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','-1 -1 23 23');
  svg.setAttribute('class','qr');
  svg.setAttribute('aria-hidden','true');
  const fondo = document.createElementNS(ns,'rect');
  fondo.setAttribute('x','-1'); fondo.setAttribute('y','-1');
  fondo.setAttribute('width','23'); fondo.setAttribute('height','23');
  fondo.setAttribute('fill','#fff'); svg.append(fondo);
  const finders = [[0,0],[14,0],[0,14]];
  const celdas = [];
  for(let y=0;y<21;y++){
    for(let x=0;x<21;x++){
      const finder = finders.find(([fx,fy])=>x>=fx && x<fx+7 && y>=fy && y<fy+7);
      const oscuro = finder
        ? (()=>{ const dx=x-finder[0], dy=y-finder[1]; return dx===0 || dx===6 || dy===0 || dy===6 || (dx>=2 && dx<=4 && dy>=2 && dy<=4); })()
        : (x*17+y*31+x*y*7)%13<6;
      if(oscuro) celdas.push(`M${x} ${y}h1v1h-1z`);
    }
  }
  const modulos = document.createElementNS(ns,'path');
  modulos.setAttribute('d',celdas.join(''));
  modulos.setAttribute('fill','#000');
  svg.append(modulos);
  return svg;
}

function pTicket(){
  const t = construyeTicket();
  const barra = h('div',{class:'barra',role:'progressbar','aria-valuemin':'0','aria-valuemax':'100','aria-valuenow':'0'},h('i'));
  const estado = h('p',{class:'estado mono','aria-live':'polite'},'Interpretando tus respuestas…');
  const titular = h('h2',{class:'titular grande'},'Gracias.');
  const cuerpo = h('p',{class:'cuerpo'},'Estamos preparando tu ticket.');
  const izq = h('div',{class:'izq'},titular,cuerpo,barra,estado);

  const filas = t.filas.map(f=>h('div',{class:'fila'},h('span',{class:'n'},f.nombre),h('span',{class:'c'},String(f.objetos))));
  const ticket = h('article',{class:'ticket','aria-label':'Tu ticket'},
    h('div',{class:'th'},h('b',{},'Cargando...')),
    h('div',{class:'meta'},h('span',{},t.punto),h('span',{},'Código '+t.codigo)),
    h('hr'),
    h('div',{class:'cubo'},h('span',{},'Cubo'),h('b',{},t.cubo)),
    h('hr'),
    h('div',{class:'filas'},...filas),
    h('hr'),
    h('div',{class:'total'},h('span',{},'Total de objetos'),h('span',{},String(t.total))),
    h('hr'),
    h('div',{class:'pie-t'},h('div',{class:'sello'},'Sello de salida'),qrDecorativo()),
    h('div',{class:'gracias'},'Entrega este ticket en cada sala'));
  const der = h('div',{class:'ranura-wrap'},h('div',{class:'ranura'}),h('div',{class:'ticket-caja'},ticket));
  const el = h('main',{class:'pantalla'},h('div',{class:'final'},izq,der));
  montar('ticket', cabecera(), el);

  enviarAImpresora(t);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let p = 0;
  const iv = setInterval(()=>{
    p = Math.min(100,p+ (reduce?50:4+Math.random()*7));
    barra.firstChild.style.width = p+'%'; barra.setAttribute('aria-valuenow',Math.round(p));
    if(p>=100){
      clearInterval(iv);
      estado.textContent = 'Tu ticket se está imprimiendo…';
      cuerpo.textContent = 'Tu ticket se está imprimiendo.';
      requestAnimationFrame(()=>requestAnimationFrame(()=>ticket.classList.add('sale')));
      let i=0; const fi = setInterval(()=>{
        if(i<filas.length) filas[i++].classList.add('v'); else { filas.forEach(f=>f.classList.add('v')); clearInterval(fi); }
      }, reduce?0:420);
      setTimeout(()=>{
        barra.classList.add('ok'); barra.style.display='none';
        titular.textContent = 'Listo.';
        cuerpo.textContent = 'Recoge tu ticket en la máquina de esta carpa y entra en las salas.';
        estado.textContent = 'Ticket impreso · código '+t.codigo;
        izq.append(h('div',{class:'hecho-fila'},h('button',{class:'btn primario',onclick:()=>{ resetEstado(); paso=0; pantalla(); }},'Terminar')));
      }, reduce?100:3300);
    }
  }, 120);
}

/* ---------- diálogo "dejar la encuesta" ---------- */
function dialogoDejar(){
  const cerrar = ()=>v.remove();
  const v = h('div',{class:'vel',role:'dialog','aria-modal':'true','aria-labelledby':'dl-t'},
    h('div',{class:'dlg'},
      h('h3',{id:'dl-t'},'¿Dejar la encuesta?'),
      h('p',{},'No se guardará ninguna respuesta y no se imprimirá ticket.'),
      h('div',{class:'acc'},
        h('button',{class:'btn primario',onclick:cerrar},'Seguir'),
        h('button',{class:'btn',onclick:()=>{ cerrar(); resetEstado(); paso=0; pantalla(); }},'Dejarla'))));
  document.body.append(v); v.querySelector('button').focus();
  addEventListener('keydown',function esc(e){ if(e.key==='Escape'){ cerrar(); removeEventListener('keydown',esc);} });
}
